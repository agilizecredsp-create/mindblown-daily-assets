name: Render Achadinho
on:
  repository_dispatch:
    types: [render-achadinho]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar FFmpeg
        timeout-minutes: 5
        run: |
          curl -sL --fail --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          mkdir -p /tmp/ff && tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ff --strip-components=1
          sudo mv /tmp/ff/bin/ffmpeg /tmp/ff/bin/ffprobe /usr/local/bin/
          ffmpeg -version | head -1
      - name: Renderizar
        env:
          IMAGE_URL: ${{ github.event.client_payload.imageUrl }}
          NARRACAO: ${{ github.event.client_payload.narracao }}
          PRECO: ${{ github.event.client_payload.preco }}
          PRECO_DE: ${{ github.event.client_payload.precoDe }}
          DESCONTO: ${{ github.event.client_payload.desconto }}
          SELO: ${{ github.event.client_payload.selo }}
          CTA: ${{ github.event.client_payload.cta }}
        run: |
          chmod +x achadinho/render_achadinho.sh
          ./achadinho/render_achadinho.sh
      - name: Publicar como Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="achadinho-${{ github.event.client_payload.correlationId }}"
          gh release create "$TAG" render_work/video.mp4 render_work/capa.jpg --title "$TAG" --notes "Achadinho automatico via n8n"
